<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Stroke capture prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Stroke capture prototype</h1>
    <div class="toolbar">
        <button id="clearBtn">Clear</button>
        <button id="exportBtn">Export JSON</button>
        <span id="status">Strokes: 0 | Rows: 0</span>
    </div>

    <div id="area" class="writing-area">
        <canvas id="ink"></canvas>
    </div>

    <h3>Recognized code <span id="recognizeStatus"></span></h3>
    <div id="editor"></div>

    <h3>Strokes per row</h3>
    <pre id="rowSummary">(none yet)</pre>
    <h3>Last Stroke</h3>
    <pre id="lastStroke">(none yet)</pre>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/capture.js"></script>
</body>
</html>
